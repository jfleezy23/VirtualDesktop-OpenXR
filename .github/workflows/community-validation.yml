name: Community validation

on:
  push:
    branches: [stable, experimental-nr]
  pull_request:
    branches: [stable, experimental-nr]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  source-checks:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    outputs:
      base: ${{ steps.base.outputs.sha }}
      platforms: ${{ steps.base.outputs.platforms }}
      experimental: ${{ steps.base.outputs.experimental }}
      runner: ${{ steps.base.outputs.runner }}
      vs_range: ${{ steps.base.outputs.vs_range }}
      toolset: ${{ steps.base.outputs.toolset }}
      tools_version: ${{ steps.base.outputs.tools_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Resolve review baseline and supported architectures
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          STABLE_BASELINE: 6da20fe478e331c05672243fd82a9a1500cd39f5
          NR_BASELINE: 925dc598c524cb48b37fa4b0a2bff471f75fc5c4
        run: |
          # NR's vendor imports and architecture limits belong to its inherited upstream baseline.
          $hygieneRef = if ($env:TARGET_BRANCH -eq 'experimental-nr') { $env:NR_BASELINE } else { $env:STABLE_BASELINE }
          $hygieneSha = git rev-parse --verify "$hygieneRef^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The source hygiene baseline is unavailable.' }
          "hygiene_sha=$hygieneSha" >> $env:GITHUB_OUTPUT
          if (!$env:BASE_REF -or $env:BASE_REF -match '^0+$') { $env:BASE_REF = $hygieneSha }
          $sha = git rev-parse --verify "$($env:BASE_REF)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The review baseline is unavailable.' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          if ($env:TARGET_BRANCH -eq 'experimental-nr') {
            'platforms=["x64"]' >> $env:GITHUB_OUTPUT
            'experimental=true' >> $env:GITHUB_OUTPUT
            'runner=windows-2025-vs2026' >> $env:GITHUB_OUTPUT
            'vs_range=[18.0,19.0)' >> $env:GITHUB_OUTPUT
            'toolset=v145' >> $env:GITHUB_OUTPUT
            'tools_version=14.51.36231' >> $env:GITHUB_OUTPUT
          } else {
            'platforms=["Win32","x64"]' >> $env:GITHUB_OUTPUT
            'experimental=false' >> $env:GITHUB_OUTPUT
            'runner=windows-2022' >> $env:GITHUB_OUTPUT
            'vs_range=[17.0,18.0)' >> $env:GITHUB_OUTPUT
            'toolset=v143' >> $env:GITHUB_OUTPUT
            'tools_version=14.44.35207' >> $env:GITHUB_OUTPUT
          }
      - name: Install pinned formatter
        run: |
          python -m pip install clang-format==22.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-format --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tooling regressions and Python compilation
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q scripts/check-hygiene.py scripts/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Current source hygiene
        env:
          REVIEW_BASE: ${{ steps.base.outputs.hygiene_sha }}
        run: |
          python scripts/check-hygiene.py --base $env:REVIEW_BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check $env:REVIEW_BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  core-builds:
    needs: source-checks
    runs-on: ${{ needs.source-checks.outputs.runner }}
    env:
      VDXR_TOOLSET: ${{ needs.source-checks.outputs.toolset }}
      VDXR_VCTOOLS_VERSION: ${{ needs.source-checks.outputs.tools_version }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.source-checks.outputs.platforms) }}
        configuration: [Release, ReleaseBundle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: ${{ needs.source-checks.outputs.vs_range }}
          msbuild-architecture: x64
      - name: Restore NuGet
        run: |
          nuget restore VirtualDesktop-OpenXR.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned core project
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          & scripts/Build-CommunityRuntime.ps1 -Configuration $env:BUILD_CONFIGURATION -Platform $env:BUILD_PLATFORM -Toolset $env:VDXR_TOOLSET -VCToolsVersion $env:VDXR_VCTOOLS_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage pinned Vulkan loader for CPU regressions
        if: (needs.source-checks.outputs.experimental == 'true' || github.base_ref == 'stable' || github.ref_name == 'stable') && matrix.platform == 'x64' && matrix.configuration == 'ReleaseBundle'
        run: |
          $systemLoader = Join-Path $env:SystemRoot 'System32/vulkan-1.dll'
          Write-Output "System32 Vulkan loader present before staging: $(Test-Path -LiteralPath $systemLoader)"
          $zipPath = Join-Path $env:RUNNER_TEMP 'VulkanRT-X64-1.4.341.0-Components.zip'
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/1.4.341.0/windows/VulkanRT-X64-1.4.341.0-Components.zip' -OutFile $zipPath
          $expectedHash = '20571dcc8292b80a47d68bbbfa4094d87044041f50f4e2e1f326a01e3732b226'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash -ne $expectedHash) {
            throw 'Vulkan loader archive checksum mismatch.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @{
              'vulkan-1.dll' = $archive.GetEntry('VulkanRT-X64-1.4.341.0-Components/x64/vulkan-1.dll')
              'VulkanRT-License.txt' = $archive.GetEntry('VulkanRT-X64-1.4.341.0-Components/VulkanRT-License.txt')
            }
            if (@($entries.Values | Where-Object { $null -eq $_ }).Count) {
              throw 'The pinned Vulkan archive is missing required entries.'
            }
            foreach ($relative in @('bin/vr-input-tests', 'bin/tests/redirect')) {
              $destination = Join-Path (Get-Location) $relative
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
              foreach ($name in $entries.Keys) {
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[$name], (Join-Path $destination $name), $true)
              }
              $loader = Get-Item -LiteralPath (Join-Path $destination 'vulkan-1.dll')
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $loader.FullName).Hash
              Write-Output "Staged $relative/vulkan-1.dll: version=$($loader.VersionInfo.FileVersion); SHA256=$hash"
            }
          } finally {
            $archive.Dispose()
          }
      - name: CPU regressions on fresh matching runtime objects
        if: (needs.source-checks.outputs.experimental == 'true' || github.base_ref == 'stable' || github.ref_name == 'stable') && matrix.platform == 'x64' && matrix.configuration == 'ReleaseBundle'
        run: |
          $source = (Resolve-Path 'virtualdesktop-openxr').Path
          $objects = (Resolve-Path 'bin/community/build/x64/ReleaseBundle/obj').Path
          foreach ($fixture in @('vr_input_regression.cpp', 'vr_input_watcher_regression.cpp', 'nonnr_input_regression.cpp', 'nonnr_gpu_timer_regression.cpp', 'nonnr_async_regression.cpp', 'nonnr_copy_preprocess_regression.cpp', 'nonnr_gl_regression.cpp')) {
            & tests/vr_input_build.cmd -SourceDirectory $source -RuntimeObjectDirectory $objects -TestSource $fixture -Toolset $env:VDXR_TOOLSET
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & tests/build-runtime-redirect-regression.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Build the repository's isolated backend for CPU submission/ownership regressions.
          $backendRoot = Join-Path (Get-Location) 'bin/community/cpu-backend'
          $backendObjects = Join-Path $backendRoot 'obj'
          New-Item -ItemType Directory -Force -Path $backendObjects | Out-Null
          $solutionProperty = (Get-Location).Path.Replace('\', '/') + '/'
          $backendProperty = $backendRoot.Replace('\', '/') + '/'
          $backendObjectsProperty = $backendObjects.Replace('\', '/') + '/'
          $backendArguments = @(
            'OVRNull/OVRNull.vcxproj', '/t:Rebuild', '/m', '/nologo', '/v:minimal',
            '/p:Configuration=Release', '/p:Platform=x64', "/p:SolutionDir=$solutionProperty",
            "/p:PlatformToolset=$env:VDXR_TOOLSET", "/p:VCToolsVersion=$env:VDXR_VCTOOLS_VERSION", '/p:WindowsTargetPlatformVersion=10.0.26100.0',
            "/p:OutDir=$backendProperty", "/p:IntDir=$backendObjectsProperty",
            '/p:PreBuildEventUseInBuild=false', '/p:PostBuildEventUseInBuild=false'
          )
          & MSBuild.exe @backendArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          function Invoke-Regression([string]$executable, [string[]]$arguments, [string]$name) {
            $stdout = Join-Path (Get-Location) "bin/community/$name.stdout.log"
            $stderr = Join-Path (Get-Location) "bin/community/$name.stderr.log"
            $options = @{
              FilePath = (Resolve-Path $executable).Path
              PassThru = $true
              WindowStyle = 'Hidden'
              RedirectStandardOutput = $stdout
              RedirectStandardError = $stderr
            }
            if ($arguments.Count) {
              $options.ArgumentList = @($arguments | ForEach-Object { '"' + $_ + '"' })
            }
            $process = Start-Process @options
            if (!$process.WaitForExit(60000)) {
              $process.Kill()
              throw "Regression timed out: $name"
            }
            $process.WaitForExit()
            $exitCode = $process.ExitCode
            $exitBits = [BitConverter]::ToUInt32([BitConverter]::GetBytes([int]$exitCode), 0)
            Write-Output ("Regression {0}: ExitCode={1} (0x{2:X8}); stdoutBytes={3}; stderrBytes={4}" -f $name, $exitCode, $exitBits, (Get-Item $stdout).Length, (Get-Item $stderr).Length)
            $text = (Get-Content -Raw $stdout) + (Get-Content -Raw $stderr)
            Write-Output $text
            if ($process.ExitCode -ne 0 -or $text -notmatch '(?m)^PASS:' -or $text -match '(?m)^(FAIL|ERROR):') {
              throw "Regression failed: $name"
            }
          }
          Invoke-Regression 'bin/vr-input-tests/vr_input_regression.exe' @() 'input'
          Invoke-Regression 'bin/vr-input-tests/vr_input_watcher_regression.exe' @() 'watcher'
          Invoke-Regression 'bin/vr-input-tests/nonnr_gpu_timer_regression.exe' @('contract') 'nonnr-gpu-timer'
          Invoke-Regression 'bin/vr-input-tests/nonnr_gl_regression.exe' @('initial-wgl') 'nonnr-gl-initial-wgl'
          Invoke-Regression 'bin/vr-input-tests/nonnr_gl_regression.exe' @('double-fault') 'nonnr-gl-double-fault'
          foreach ($mode in @('startup', 'error-wait', 'error-begin', 'error-end', 'shutdown-not-initialized', 'control-during-wait', 'wait-retry', 'layers-sync', 'layers-async', 'storage-sync', 'storage-async', 'gated-end')) {
            Invoke-Regression 'bin/vr-input-tests/nonnr_async_regression.exe' @($mode, $backendRoot) "nonnr-async-$mode"
          }
          foreach ($mode in @('cpu', 'query-cache', 'action-pose', 'sync-set-paths')) {
            Invoke-Regression 'bin/vr-input-tests/nonnr_input_regression.exe' @($mode) "nonnr-input-$mode"
          }
          $runtime = (Resolve-Path 'bin/community/build/x64/ReleaseBundle/virtualdesktop-openxr.dll').Path
          Invoke-Regression 'bin/tests/redirect/runtime_negotiation_regression.exe' @($runtime) 'negotiation'
          foreach ($mode in @('failure', 'success')) {
            $target = (Resolve-Path "bin/tests/redirect/vdxr_redirect_$($mode)_test.dll").Path
            Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($runtime, $target, $mode) "redirect-$mode"
            Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($runtime, $target, $mode, 'wide') "redirect-$mode-wide"
          }
          Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($runtime, $runtime, 'self') 'redirect-self'
          Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($runtime, $runtime, 'self', 'wide') 'redirect-self-wide'
          $externalDirectory = Join-Path (Get-Location) 'bin/community/redirect-target'
          New-Item -ItemType Directory -Force -Path $externalDirectory | Out-Null
          $externalRuntime = Join-Path $externalDirectory 'virtualdesktop-openxr.dll'
          Copy-Item -LiteralPath $runtime -Destination $externalRuntime
          Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($runtime, $externalRuntime, 'chain') 'redirect-chain'
          Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($runtime, $externalRuntime, 'chain', 'wide') 'redirect-chain-wide'
          $bundledDirectory = Join-Path (Get-Location) 'bin/community/registered-forwarder/OpenXR'
          New-Item -ItemType Directory -Force -Path $bundledDirectory | Out-Null
          $bundledRuntime = Join-Path $bundledDirectory 'virtualdesktop-openxr.dll'
          Copy-Item -LiteralPath $runtime -Destination $bundledRuntime
          foreach ($mode in @('bundled', 'bundled-failure')) {
            Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($bundledRuntime, $externalRuntime, $mode) "redirect-$mode"
          }
          Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($bundledRuntime, $externalRuntime, 'bundled', 'wide') 'redirect-bundled-wide'
          Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($bundledRuntime, $bundledRuntime, 'bundled-self') 'redirect-bundled-self'
          $standaloneOutput = Join-Path (Get-Location) 'bin/community/retention-standalone'
          & scripts/Build-CommunityRuntime.ps1 -Configuration Release -Platform x64 -Toolset $env:VDXR_TOOLSET -VCToolsVersion $env:VDXR_VCTOOLS_VERSION -OutputDirectory $standaloneOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $standaloneRuntime = Join-Path $standaloneOutput 'virtualdesktop-openxr.dll'
          Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($bundledRuntime, $standaloneRuntime, 'bundled-standalone') 'redirect-bundled-standalone'
          $unrelatedDirectory = Join-Path (Get-Location) 'bin/community/registered-nonruntime/OpenXR'
          New-Item -ItemType Directory -Force -Path $unrelatedDirectory | Out-Null
          Copy-Item -LiteralPath 'bin/tests/redirect/vdxr_redirect_non_runtime_test.dll' -Destination (Join-Path $unrelatedDirectory 'virtualdesktop-openxr.dll')
          $unrelatedTargetDirectory = Join-Path (Split-Path $unrelatedDirectory) 'Custom'
          New-Item -ItemType Directory -Force -Path $unrelatedTargetDirectory | Out-Null
          $unrelatedTarget = Join-Path $unrelatedTargetDirectory 'virtualdesktop-openxr.dll'
          Copy-Item -LiteralPath $runtime -Destination $unrelatedTarget
          Invoke-Regression 'bin/tests/redirect/runtime_redirect_regression.exe' @($unrelatedTarget, $unrelatedTarget, 'bundled-unrelated') 'redirect-bundled-unrelated'

  analyzer-comparison:
    needs: source-checks
    runs-on: ${{ needs.source-checks.outputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.source-checks.outputs.platforms) }}
        configuration: [Release, ReleaseBundle]
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
      VDXR_TOOLSET: ${{ needs.source-checks.outputs.toolset }}
      VDXR_VCTOOLS_VERSION: ${{ needs.source-checks.outputs.tools_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ needs.source-checks.outputs.base }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: ${{ needs.source-checks.outputs.vs_range }}
          msbuild-architecture: x64
      - name: Restore and analyze baseline and candidate with identical tools
        run: |
          foreach ($cohort in @('baseline', 'candidate')) {
            nuget restore "$cohort/VirtualDesktop-OpenXR.sln" -NonInteractive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & candidate/scripts/Build-CommunityRuntime.ps1 -SourceDirectory $cohort -Configuration $env:BUILD_CONFIGURATION -Platform $env:BUILD_PLATFORM -Toolset $env:VDXR_TOOLSET -VCToolsVersion $env:VDXR_VCTOOLS_VERSION -Analyze
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Reject new compiler and analyzer diagnostics
        run: |
          function Read-Diagnostics([string]$cohort) {
            $root = (Resolve-Path $cohort).Path.Replace('\', '/').ToLowerInvariant()
            $counts = @{}
            foreach ($line in Get-Content "$cohort/bin/community/analyze/$env:BUILD_PLATFORM/$env:BUILD_CONFIGURATION/build.log") {
              $normalized = $line.Replace('\', '/').ToLowerInvariant().Replace($root + '/', '')
              if ($normalized -match '^(.*?)\(\d+(?:,\d+)?\)\s*:\s*warning\s+([a-z]+\d+)\s*:\s*(.*?)(?:\s+\[.*\])?$') {
                $key = $Matches[1] + ': ' + $Matches[2] + ': ' + $Matches[3]
              } elseif ($normalized -match '^(.*?)\s*:\s*(?:command line\s+)?warning\s+([a-z]+\d+)\s*:\s*(.*?)(?:\s+\[.*\])?$') {
                $key = $Matches[1] + ': ' + $Matches[2] + ': ' + $Matches[3]
              } elseif ($normalized -match ':\s*(?:command line\s+)?warning\b|\bwarning\s+[a-z]+\d+') {
                throw "Unparsed diagnostic in $cohort`: $line"
              } else { continue }
              $key = $key -replace ': lines: [\d, ]+$', '' -replace '\bline (?:\x27)?\d+(?:\x27)?', 'line <location>'
              $counts[$key] = 1 + $counts[$key]
            }
            return $counts
          }
          $baseline = Read-Diagnostics 'baseline'
          $candidate = Read-Diagnostics 'candidate'
          $introduced = @($candidate.Keys | Where-Object { $candidate[$_] -gt $baseline[$_] })
          if ($introduced.Count) {
            $introduced | Sort-Object | ForEach-Object { Write-Output "NEW DIAGNOSTIC: $_ ($($candidate[$_]) vs $($baseline[$_]))" }
            throw 'New compiler/analyzer diagnostics require resolution.'
          }
          Write-Output "PASS: no new diagnostics ($($candidate.Count) candidate diagnostic identities)."
